<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Store | Categorías</title>
    <link rel="stylesheet" href="../../../style.css" />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0"
    />

</head>
<body>
    <body>
    <main class="admin-layout">
      <aside class="admin-sidebar">
        <h1>Food Store</h1>

        <nav>
          <a href="../home/home.html">
            <span class="material-symbols-outlined">dashboard</span>
            Dashboard
          </a>

          <a href="./categories.html">
            <span class="material-symbols-outlined">category</span>
            Categorías
          </a>

          <a href="../products/products.html">
            <span class="material-symbols-outlined">inventory_2</span>
            Productos
          </a>

          <a href="../orders/orders.html">
            <span class="material-symbols-outlined">receipt_long</span>
            Pedidos
          </a>

          <a href="../../store/home/home.html">
            <span class="material-symbols-outlined">storefront</span>
            Ver tienda
          </a>
        </nav>

        <button id="logoutButton">
          <span class="material-symbols-outlined">logout</span>
          Cerrar sesión
        </button>
      </aside>

      <section class="admin-content">
        <h2>Gestión de categorías</h2>

        <button id="botonNuevaCategoria">
          <span class="material-symbols-outlined">add</span>
          Nueva categoría
        </button>

        <p id="mensajeCategorias"></p>

        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Imagen</th>
              <th>Nombre</th>
              <th>Descripción</th>
              <th>Acciones</th>
            </tr>
          </thead>

          <tbody id="cuerpoTablaCategorias"></tbody>
        </table>

        <section id="contenedorFormularioCategoria" hidden>
          <h3 id="tituloFormularioCategoria">Nueva categoría</h3>

          <form id="formularioCategoria">
            <input type="hidden" id="idCategoria" />

            <label for="nombreCategoria">Nombre</label>
            <input type="text" id="nombreCategoria" required />

            <label for="descripcionCategoria">Descripción</label>
            <textarea id="descripcionCategoria" required></textarea>

            <label for="imagenCategoria">URL de la imagen</label>
            <input type="text" id="imagenCategoria"placeholder="Pegá aquí la URL directa de la imagen" required />

            <button type="submit">
              <span class="material-symbols-outlined">save</span>
              Guardar
            </button>

            <button type="button" id="botonCancelarCategoria">
              <span class="material-symbols-outlined">close</span>
              Cancelar
            </button>
          </form>
        </section>
      </section>
    </main>
    <footer>&copy; Mi página web - FOOD STORE</footer>
    <script type="module" src="./categories.ts"></script>
</body>
</html>
