<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Food Store | Pedidos</title>
     <link rel="stylesheet" href="../../../style.css" />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0"
    />
</head>
<body>
    <main class="admin-layout">
      <aside class="admin-sidebar">
        <h1>Food Store</h1>

        <nav>
          <a href="../home/home.html">
            <span class="material-symbols-outlined">dashboard</span>
            Dashboard
          </a>

          <a href="../categories/categories.html">
            <span class="material-symbols-outlined">category</span>
            Categorías
          </a>

          <a href="../products/products.html">
            <span class="material-symbols-outlined">inventory_2</span>
            Productos
          </a>

          <a href="./orders.html">
            <span class="material-symbols-outlined">receipt_long</span>
            Pedidos
          </a>

          <a href="../../store/home/home.html">
            <span class="material-symbols-outlined">storefront</span>
            Ver tienda
          </a>
        </nav>

        <button id="logoutButton">
          <span class="material-symbols-outlined">logout</span>
          Cerrar sesión
        </button>
      </aside>

      <section class="admin-content">
        <h2>Gestión de pedidos</h2>

        <label for="filtroCliente">Filtrar por cliente</label>
        <select id="filtroCliente">
          <option value="">Todos los clientes</option>
        </select>

        <p id="mensajePedidosAdmin"></p>

        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Cliente</th>
              <th>Fecha</th>
              <th>Estado</th>
              <th>Cantidad</th>
              <th>Total</th>
              <th>Acciones</th>
            </tr>
          </thead>

          <tbody id="cuerpoTablaPedidos"></tbody>
        </table>

        <section id="modalDetallePedido" hidden>
          <button
            type="button"
            id="botonCerrarDetallePedido"
            aria-label="Cerrar detalle"
          >
            <span class="material-symbols-outlined">close</span>
            Cerrar
          </button>

          <div id="detallePedidoAdmin"></div>
        </section>
      </section>
    </main>

    <footer>&copy; Mi página web - FOOD STORE</footer>

    <script type="module" src="./orders.ts"></script>
  </body>
</html>
