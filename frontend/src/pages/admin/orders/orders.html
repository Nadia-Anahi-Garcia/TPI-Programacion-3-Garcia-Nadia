<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Food Store | Pedidos</title>
     <link rel="stylesheet" href="../../../style.css" />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0"
    />
</head>
<body>
<header>
  <div class="marca">
    <img src="/assets/icono-food-store.png" alt="Logo Food Store">
    <h1>Food Store</h1>
  </div>

  <nav class="menu-principal">
    <a href="../../store/home/home.html">
      <span class="material-symbols-outlined">storefront</span>
      Tienda
    </a>

    <a href="../home/home.html" aria-current="page">
      <span class="material-symbols-outlined">admin_panel_settings</span>
      Panel Admin
    </a>

    <span id="nombreUsuario"></span>

    <button id="logoutButton" type="button">
      Cerrar sesión
    </button>
  </nav>
</header>
    <main class="admin-layout">
      <aside class="admin-sidebar">

        <nav>
          <a href="../home/home.html">
            <span class="material-symbols-outlined">dashboard</span>
            Dashboard
          </a>

          <a href="../categories/categories.html">
            <span class="material-symbols-outlined">category</span>
            Categorías
          </a>

          <a href="../products/products.html">
            <span class="material-symbols-outlined">inventory_2</span>
            Productos
          </a>

          <a href="./orders.html" aria-current="page">
            <span class="material-symbols-outlined">receipt_long</span>
            Pedidos
          </a>

          <a href="../../store/home/home.html">
            <span class="material-symbols-outlined">storefront</span>
            Ver tienda
          </a>
        </nav>
      </aside>

      <section class="admin-content">
        <h2>Gestión de pedidos</h2>

        <div class="filtros-pedidos-admin">
          <div class="filtro-pedido-admin">
            <label for="filtroCliente">Filtrar por cliente</label>
            <select id="filtroCliente">
              <option value="">Todos los clientes</option>
            </select>
          </div>

          <div class="filtro-pedido-admin">
            <label for="filtroEstado">Filtrar por estado</label>
            <select id="filtroEstado">
              <option value="">Todos los estados</option>
              <option value="PENDIENTE">Pendiente</option>
              <option value="CONFIRMADO">Confirmado</option>
              <option value="TERMINADO">Terminado</option>
              <option value="CANCELADO">Cancelado</option>
            </select>
          </div>
        </div>

        <p id="mensajePedidosAdmin"></p>

        <section id="contenedorPedidosAdmin"></section>

        <section id="modalDetallePedido" class="modal" hidden>
          <div class="modal-contenido">
            <button
                    type="button"
                    id="botonCerrarDetallePedido"
                    class="boton-cerrar-modal"
                    aria-label="Cerrar detalle"
            >
              ×
            </button>

            <div id="detallePedidoAdmin"></div>
          </div>
        </section>
      </section>
    </main>

    <footer>&copy; Mi página web - FOOD STORE</footer>

    <script type="module" src="./orders.ts"></script>
  </body>
</html>
