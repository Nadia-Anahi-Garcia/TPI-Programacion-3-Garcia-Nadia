<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Store | Login Usuario </title>
</head>

<body>

    <div class="container">

        <form id="form" class="login__form">

            <h1> Food Store</h1>
            <h2>Iniciar Sesión</h2>

            <div>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="off" placeholder="ejemplo@ejemplo.com" required>
            </div>
            <div>
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" autocomplete="off" placeholder="********" required>
            </div>
       
            <button type="submit">Ingresar</button>

            <p class="registro">
                ¿No tenés cuenta? <a href="../registro/registro.html">Registrate acá</a>
            </p>

        </form>

    </div>

    <footer>&copy; Mi pagina web - FOOD STORE</footer>
    
    <script type="module" src="./login.ts"></script>
</body>

</html>
