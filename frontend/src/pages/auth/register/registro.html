<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Store | Registro</title>
    <link rel="stylesheet" href="/src/style.css">

</head>

<body>
    <div class="container">
        <form class="login__form" id="form">
            <h1>Food Store</h1>
            <H2>Crear una cuenta</H2>

            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido" name="apellido" required>
            
            <label for="celular">Celular:</label>
            <input type="tel" id="celular" name="celular" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" placeholder="Minimo 8 caracteres" required>

            <button type="submit">REGISTRARME</button>

            <p class="registro">
                ¿Ya tenés cuenta? <a href="../login/login.html"> Iniciá Sesión</a>
            </p>
        </form>
    </div>  

    <script type="module" src="./registro.ts"></script>
     <footer>&copy; Mi pagina web - FOOD STORE</footer>
</body>

</html>
